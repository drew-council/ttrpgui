[[sections]]
name = "Traits"

[[sections.entries]]
name = "Heated Body"
text = "A creature that touches the drake or hits it with a melee attack within 5 feet takes 2d6 fire damage."

[[sections]]
name = "Actions"

[[sections.entries]]
name = "Multiattack"
text = "The drake makes one **Bite** and two **Claw** attacks."

[[sections.entries]]
name = "Bite"
text = "*Melee:* +9 to hit, reach 10 ft. 2d10 + 5 piercing plus 1d6 fire."

[[sections.entries]]
name = "Claw"
text = "*Melee:* +9 to hit, reach 5 ft. 2d6 + 5 slashing."

[[sections.entries]]
name = "Cinder Breath (Recharge 5-6)"
text = """
Exhales embers in a 40-foot cone. Each creature there makes a DC 16 Dexterity save,
taking 12d6 fire damage on a failure or half as much on a success."""

[[sections]]
name = "Legendary Actions"

[[sections.entries]]
name = "Tail Sweep"
text = "The drake makes one Claw attack."

[[sections.entries]]
name = "Ash Cloud (Costs 2 Actions)"
text = "Ash fills a 20-foot sphere centered on the drake. The area is heavily obscured until the start of its next turn."
